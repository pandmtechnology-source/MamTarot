    background-size: cover, cover;
    background-position: center top, center top;
    background-repeat: no-repeat, no-repeat;
    background-attachment: fixed, fixed;
    font-family:'Noto Sans Thai',sans-serif;
    color:var(--text);
    padding:48px 20px 80px;
  }
  .wrap{max-width:960px;margin:0 auto;position:relative;z-index:2;}
  header{text-align:center;margin-bottom:8px;}
  .eyebrow{
    font-family:'Noto Serif Thai',serif;font-weight:600;
    font-size:clamp(19px,4.2vw,26px);letter-spacing:.06em;color:var(--gold-soft);
    text-shadow:0 0 14px rgba(228,200,119,.4);
    display:flex;align-items:center;justify-content:center;gap:10px;
    text-align:center;line-height:1.15;
    margin-bottom:12px;
  }
  .eyebrow-lines{display:inline-block;}
  .eyebrow-lines span{display:block;white-space:nowrap;}
  .eyebrow::before,.eyebrow::after{content:'✦';font-size:11px;opacity:.7;}
  h1{
    font-family:'Noto Serif Thai',serif;font-weight:600;
    font-size:clamp(22px,3.2vw,34px);margin:0 0 12px;
    color:var(--text);line-height:1.12;
  }
  .sub{color:var(--text-muted);font-size:15px;max-width:520px;margin:0 auto 16px;line-height:1.7;}
  .summary-donate-link{
    display:block;width:100%;cursor:pointer;
    text-align:inherit;font:inherit;color:inherit;
    background:rgba(201,162,75,.08);
    border:1px dashed rgba(201,162,75,.55);
    border-radius:12px;
    padding:8px 12px;
    margin:0 0 10px;
    transition:background .2s ease, border-color .2s ease, transform .15s ease;
    animation:donateLinkPulse 2.6s ease-in-out infinite;
  }
  .summary-donate-link:hover,
  .summary-donate-link:focus-visible{
    background:rgba(201,162,75,.16);border-color:rgba(201,162,75,.9);
  }
  .summary-donate-link:active{transform:scale(.98);}
  .summary-donate-link:hover .summary-brand,
  .summary-donate-link:hover .summary-blessing{color:#fff;}
  .scan-icon-inline{vertical-align:-3px;margin:0 2px;color:var(--gold-soft);}
  @keyframes donateLinkPulse{
    0%,100%{box-shadow:0 0 0 rgba(201,162,75,0);}
    50%{box-shadow:0 0 14px rgba(201,162,75,.35);}
  }

  .aspect-picker{
    display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-bottom:28px;
  }
  .aspect-pill{
    font-family:'Noto Sans Thai',sans-serif;font-size:13px;font-weight:500;
    background:rgba(255,255,255,.04);color:var(--text-muted);
    border:1px solid rgba(201,162,75,.25);border-radius:999px;
    padding:6px 12px;cursor:pointer;display:flex;align-items:center;gap:6px;
    transition:background .15s ease, color .15s ease, border-color .15s ease;
  }
  .aspect-pill i{font-size:14px;}
  .aspect-pill:hover{border-color:rgba(201,162,75,.5);color:var(--text);}
  .aspect-pill.active{
    background:linear-gradient(180deg,var(--gold-soft),var(--gold));
    color:#2A1E08;border-color:transparent;
  }
  .aspect-pill.done{
    opacity:.55;cursor:pointer;
    background:rgba(255,255,255,.03);color:var(--text-muted);border-color:rgba(201,162,75,.15);
  }
  .aspect-pill.done:hover{opacity:.8;border-color:rgba(201,162,75,.4);}

  .draw-area{text-align:center;margin-bottom:0;}
  .draw-area-bottom{margin-top:18px;display:flex;flex-direction:column;align-items:center;gap:10px;}
  .donate-link-bottom{width:auto;max-width:360px;margin:0;font-size:13px;padding:9px 20px;}
  button.draw-btn{
    font-family:'Noto Sans Thai',sans-serif;font-weight:600;font-size:11px;
    background:linear-gradient(180deg,var(--gold-soft),var(--gold));
    color:#2A1E08;border:none;padding:7px 16px;border-radius:999px;
    cursor:pointer;letter-spacing:.02em;
    box-shadow:0 8px 24px -8px rgba(201,162,75,.5);
    transition:transform .15s ease, box-shadow .15s ease;
  }
  button.draw-btn:hover{transform:translateY(-2px);box-shadow:0 12px 28px -8px rgba(201,162,75,.6);}
  button.draw-btn:active{transform:translateY(0);}
  button.draw-btn:disabled{opacity:.5;cursor:default;transform:none;}

  button.reset-btn{
    font-family:'Noto Sans Thai',sans-serif;font-weight:600;font-size:11px;
    background:transparent;color:var(--text-muted);
    border:1px solid rgba(201,162,75,.3);padding:6px 14px;border-radius:999px;
    cursor:pointer;letter-spacing:.02em;margin-left:8px;
    transition:color .15s ease, border-color .15s ease, background .2s ease, box-shadow .2s ease;
  }
  button.reset-btn:hover{color:var(--gold-soft);border-color:rgba(201,162,75,.6);}
  button.reset-btn:disabled{
    opacity:.35;cursor:not-allowed;color:var(--text-muted);border-color:rgba(201,162,75,.15);
  }
  button.reset-btn.ready{
    background:linear-gradient(180deg,var(--gold-soft),var(--gold));
    color:#2A1E08;border-color:transparent;opacity:1;
    animation:readyGlow 2.56s ease-in-out infinite;
  }
  @keyframes readyGlow{
    0%,100%{box-shadow:0 0 0 0 rgba(228,200,119,.55);}
    50%{box-shadow:0 0 0 8px rgba(228,200,119,0);}
  }

  .hint{margin-top:0;font-size:13px;color:var(--text-muted);}

  .copyright{
    margin-top:28px;
    text-align:center;
    font-size:12px;
    letter-spacing:.02em;
    color:var(--text-muted);
    opacity:.75;
  }

  .spread{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:clamp(8px,3vw,16px);
    perspective:1600px;
  }
  .reveal-row{
    display:flex;
    align-items:flex-start;
    justify-content:center;
    gap:clamp(8px,3vw,28px);
    width:100%;
    flex-wrap:nowrap;
  }
  .reveal-row .slot{
    flex:0 0 auto;
    width:clamp(110px,41vw,265px);
  }
  .meaning-panel{
    flex:1 1 auto;
    max-width:420px;
    min-width:0;
    opacity:0;
    transform:translateX(10px);
    transition:opacity .5s ease, transform .5s ease;
  }
  .meaning-panel.visible{
    opacity:1;
    transform:translateX(0);
  }
  .meaning-card{
    background:rgba(0,0,0,.28);
    border:1px solid rgba(201,162,75,.4);
    border-radius:10px;
    padding:clamp(8px,2.6vw,16px);
  }
  .meaning-head{
    display:flex;align-items:center;gap:4px;
    font-family:'Noto Serif Thai',serif;font-weight:600;
    font-size:clamp(11px,3.2vw,14px);color:var(--gold-soft);letter-spacing:.02em;margin-bottom:clamp(4px,1.5vw,8px);
  }
  .meaning-head i{font-size:clamp(10px,2.8vw,13px);}
  .meaning-text{margin:0;font-size:clamp(10.5px,3vw,13px);line-height:1.55;color:var(--text);}
  .slot{
    position:relative;
    flex:1 1 0;max-width:160px;min-width:0;
    animation:cardFloat 6.8s ease-in-out infinite;
  }
  @keyframes cardFloat{
    0%,100%{transform:translateY(0) rotate(0deg);}
    50%{transform:translateY(-7px) rotate(-1deg);}
  }
  .slot::before{
    content:'';
    position:absolute;
    inset:-18%;
    border-radius:50%;
    background:radial-gradient(circle, rgba(228,200,119,.65) 0%, rgba(228,200,119,.3) 38%, rgba(228,200,119,0) 72%);
    opacity:0;
    transform:scale(.35);
    pointer-events:none;
    z-index:-1;
  }
  .slot.burst::before{
    animation:burstGlow 1.05s ease-out forwards;
  }
  @keyframes burstGlow{
    0%{opacity:0;transform:scale(.3);}
    28%{opacity:1;transform:scale(1.05);}
    100%{opacity:0;transform:scale(2);}
  }
  .sparkle{
    position:absolute;left:50%;top:50%;
    width:5px;height:5px;border-radius:50%;
    background:radial-gradient(circle, #fff 0%, var(--gold-soft) 55%, transparent 100%);
    pointer-events:none;z-index:6;
    transform:translate(-50%,-50%);
    animation:sparkleFly .8s ease-out forwards;
  }
  @keyframes sparkleFly{
    0%{opacity:1;transform:translate(-50%,-50%) scale(1);}
    100%{opacity:0;transform:translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(.15);}
  }
  .card{
    position:relative;width:100%;aspect-ratio:0.579;height:auto;border-radius:14px;
    transform-style:preserve-3d;
    transition:transform .7s cubic-bezier(.2,.8,.2,1);
    cursor:pointer;
  }
  .card:not(.flipped){animation:readyGlow 10s ease-in-out infinite;}
  .card.flipped{
    animation:cardFlipReveal .95s cubic-bezier(.22,.85,.3,1) forwards;
    cursor:default;
  }
  @keyframes cardFlipReveal{
    0%{transform:rotateY(0deg) scale(1);}
    55%{transform:rotateY(202deg) scale(1.14);}
    78%{transform:rotateY(172deg) scale(.96);}
    100%{transform:rotateY(180deg) scale(1);}
  }
  .card.flipped .face.front{
    animation:frontGlowFade 1.1s ease-out forwards;
  }
  @keyframes frontGlowFade{
    0%{box-shadow:0 0 55px 12px rgba(228,200,119,.9);}
    100%{box-shadow:0 0 0 0 rgba(228,200,119,0);}
  }
  .face{
    position:absolute;inset:0;
    backface-visibility:hidden;border-radius:14px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    border:1px solid rgba(201,162,75,.35);
    padding:clamp(6px,2vw,14px) clamp(4px,1.5vw,12px);
  }

      var(--card-back);
    box-shadow:inset 0 0 0 6px rgba(201,162,75,.10);
    justify-content:flex-end;
  }
  .face.back svg{display:none;}
  .face.back .tap{
    margin:0 0 clamp(6px,2vw,12px);font-size:clamp(7px,2vw,11px);color:var(--gold-soft);letter-spacing:.06em;
    background:rgba(0,0,0,.4);padding:3px 8px;border-radius:999px;
  }
  .face.front{
    background:var(--card-front);color:var(--ink);
    transform:rotateY(180deg);
    overflow:hidden;
  }
  .face.front.has-art{padding:0;}
  .card-art{
    width:100%;height:100%;object-fit:cover;display:block;border-radius:14px;
  }
  .card-symbol{font-size:clamp(14px,5vw,26px);line-height:1;margin-bottom:4px;}
  .card-name{
    font-family:'Noto Serif Thai',serif;font-weight:600;font-size:clamp(8px,2.6vw,14px);
    text-align:center;margin-bottom:8px;color:var(--ink);line-height:1.3;
  }

  /* expanded detail panel below the spread */
  .details{margin-top:18px;display:flex;flex-direction:column;gap:7px;}
  .detail-card{
    background:var(--panel);border:1px solid rgba(201,162,75,.2);
    border-radius:8px;padding:10px 11px;
    animation:rise .35s ease both;
    transition:box-shadow .3s ease, border-color .3s ease;
  }
  .detail-card.highlight{
    border-color:var(--gold-soft);
    box-shadow:0 0 0 2px rgba(228,200,119,.35);
  }
  #revisit .detail-card{border-color:var(--gold-soft);box-shadow:0 0 0 2px rgba(228,200,119,.3);position:relative;}
  #revisit .revisit-label{font-size:9.5px;color:var(--gold-soft);letter-spacing:.04em;margin-bottom:4px;}
  #revisit .revisit-close{
    position:absolute;top:8px;right:8px;background:none;border:none;color:var(--text-muted);
    font-size:14px;line-height:1;cursor:pointer;padding:2px 6px;
  }
  #revisit .revisit-close:hover{color:var(--text);}
  .summary-card{
    background:transparent;border:none;
    border-radius:8px;padding:0;
    animation:rise .4s ease both;
  }
  .summary-brand{
    font-family:'Noto Serif Thai',serif;font-weight:600;font-size:14.4px;
    text-align:center;color:var(--gold-soft);letter-spacing:.04em;
    text-shadow:0 0 10px rgba(228,200,119,.4);
    margin-bottom:4px;transition:color .2s ease;
  }
  .summary-blessing{
    text-align:center;color:var(--text-muted);font-size:11px;line-height:1.5;
    margin-bottom:0;
    transition:color .2s ease;
  }
  .summary-card h3{
    font-family:'Noto Serif Thai',serif;font-weight:600;font-size:10px;margin:0 0 2px;color:var(--gold-soft);
  }
  .summary-card .summary-sub{font-size:10px;color:var(--text-muted);margin-bottom:8px;}
  .summary-card .aspect{border-left-color:var(--gold-soft);}
  .summary-card .aspect .card-tag{font-size:10px;color:var(--text-muted);margin-bottom:2px;}
  @keyframes rise{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
  @keyframes dealFromButton{
    0%{opacity:0;transform:translateY(calc(-1 * var(--deal-offset, 70px))) scale(.25) rotate(-25deg);filter:drop-shadow(0 0 0 rgba(228,200,119,0));}
    45%{opacity:1;filter:drop-shadow(0 0 18px rgba(228,200,119,.85));}
    75%{transform:translateY(2px) scale(1.02) rotate(1deg);}
    100%{opacity:1;transform:translateY(0) scale(1) rotate(0deg);filter:drop-shadow(0 0 0 rgba(228,200,119,0));}
  }
  .card.card-deal{animation:dealFromButton 2.04s cubic-bezier(.22,.75,.3,1) both;transition:none;}
  .detail-head{display:flex;align-items:baseline;gap:5px;margin-bottom:7px;}
  .detail-head .num{
    font-family:'Noto Serif Thai',serif;color:var(--gold-soft);font-size:10px;
  }
  .detail-head h3{
    font-family:'Noto Serif Thai',serif;font-weight:600;font-size:10px;margin:0;color:var(--text);
  }
  .aspects{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:6px;}
  .aspect{
    background:rgba(255,255,255,.03);border-left:2px solid var(--gold);
    border-radius:0 4px 4px 0;padding:5px 7px;
  }
  .aspect .label{
    display:flex;align-items:center;gap:3px;
    font-size:10px;color:var(--gold-soft);letter-spacing:.04em;margin-bottom:2px;
  }
  .aspect .label i{font-size:10px;}
  .aspect p{margin:0;font-size:12px;line-height:1.5;color:var(--text);}

  .sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);}

  .shadow-drift{
    position:fixed;top:-15%;left:-15%;width:130%;height:130%;pointer-events:none;z-index:1;
    background-repeat:no-repeat;
    background-image:
      radial-gradient(circle, rgba(0,0,0,.32), rgba(0,0,0,0) 60%),
      radial-gradient(circle, rgba(0,0,0,.26), rgba(0,0,0,0) 55%),
      radial-gradient(circle, rgba(0,0,0,.22), rgba(0,0,0,0) 65%);
    background-size: 55% 55%, 45% 45%, 65% 65%;
    background-position: 18% 25%, 82% 68%, 48% 92%;
    filter: blur(55px);
    will-change: transform;
    transform: translate3d(0,0,0);
    animation: shadowDrift 85s ease-in-out infinite alternate;
  }
  @keyframes shadowDrift{
    0%{ transform: translate3d(-2%, -1.5%, 0); }
    50%{ transform: translate3d(2%, 2%, 0); }
    100%{ transform: translate3d(-1%, 1%, 0); }
  }

  .lightning-flash{
    position:fixed;inset:0;pointer-events:none;z-index:1;
    background:radial-gradient(ellipse at 50% 15%, rgba(210,225,255,.5), rgba(210,225,255,0) 62%);
    opacity:0;transition:opacity .12s ease-out;
  }
  .lightning-flash.flash{transition:opacity .05s ease-out;}

  .sound-toggle{
    position:fixed;top:14px;right:14px;z-index:20;
    width:38px;height:38px;
    background:none;border:none;
    color:var(--gold-soft);font-size:15px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    transition:color .2s ease;
  }
  .sound-toggle:hover{color:#fff;}
  .sound-toggle svg{pointer-events:none;display:block;}

  .donate-modal-overlay{
    position:fixed;inset:0;z-index:50;
    background:rgba(8,4,2,.78);backdrop-filter:blur(3px);
    display:none;align-items:center;justify-content:center;
    padding:24px;
  }
  .donate-modal-overlay.open{display:flex;}
  .donate-modal{
    position:relative;max-width:360px;width:100%;
    background:linear-gradient(180deg, rgba(40,16,10,.97), rgba(20,8,6,.98));
    border:1px solid rgba(201,162,75,.4);border-radius:18px;
    padding:26px 22px 22px;text-align:center;
    box-shadow:0 20px 60px rgba(0,0,0,.55);
  }
  .donate-modal .close-btn{
    position:absolute;top:10px;right:10px;
    width:30px;height:30px;border-radius:50%;
    background:rgba(255,255,255,.06);border:1px solid rgba(201,162,75,.3);
    color:var(--gold-soft);cursor:pointer;
    display:flex;align-items:center;justify-content:center;font-size:14px;
  }
  .donate-modal .close-btn:hover{background:rgba(255,255,255,.12);}
  .donate-modal .caption-title{
    font-family:'Noto Serif Thai',serif;font-weight:600;
    color:var(--gold-soft);font-size:clamp(14px,4.6vw,17px);margin:4px -8px 10px;line-height:1.5;
    padding:0 2px;
  }
  .donate-modal .caption-title span{display:block;white-space:nowrap;}
  .donate-modal .caption-title span:first-child{font-size:clamp(11px,3.5vw,13.5px);letter-spacing:-0.2px;}
  .donate-modal img{
    width:100%;max-width:220px;border-radius:10px;margin:6px auto 14px;
    display:block;border:1px solid rgba(201,162,75,.35);background:#fff;
  }
  .donate-modal .caption-sub{
    color:var(--text-muted);font-size:14px;line-height:1.7;
  }

  @media (max-width:600px){
    body{padding:32px 12px 60px;}
  }
</style>
</head>

const spreadEl = document.getElementById('spread');
const topicSummariesEl = document.getElementById('topicSummaries');
const revisitEl = document.getElementById('revisit');
const hintEl = document.getElementById('hint');
const drawBtn = document.getElementById('drawBtn');
const resetBtn2 = document.getElementById('resetBtn2');
const donateLinkBottomEl = document.getElementById('donateLinkBottom');
const aspectPickerEl = document.getElementById('aspectPicker');

function setResetBtnsState(enabled){
  resetBtn2.disabled = !enabled;
  resetBtn2.classList.toggle('ready', enabled);
  donateLinkBottomEl.classList.toggle('ready', enabled);
}

let usedCardIndices = new Set(); // deck indices used in this reading
let currentAspect = null;        // the one topic chosen for this reading
let pendingDraw = null;          // { indices:[i,i,i], revealed:Set() } — the current 3-card draw
let readingLocked = false;       // true once at least one card has been opened — locks topic switching

function renderAspectPicker(){
  aspectPickerEl.innerHTML = ASPECTS.map(o => {
    const active = currentAspect === o.key;
    return `<button type="button" class="aspect-pill${active ? ' active' : ''}" data-key="${o.key}" ${readingLocked ? 'disabled' : ''}>
      <i class="ti ${o.icon}" aria-hidden="true"></i>${o.label}
    </button>`;
  }).join('');
  aspectPickerEl.querySelectorAll('.aspect-pill:not([disabled])').forEach(btn => {
    btn.addEventListener('click', () => {
      const key = btn.dataset.key;
      if(key === currentAspect) return;
      currentAspect = key;
      pendingDraw = null;
      spreadEl.innerHTML = '';
      topicSummariesEl.innerHTML = '';
      revisitEl.innerHTML = '';
      renderAspectPicker();
      hintEl.textContent = '';
    });
  });
}

function pickOneUnused(){
  const available = DECK.map((_, i) => i).filter(i => !usedCardIndices.has(i));
  const idx = Math.floor(Math.random() * available.length);
  return [available[idx]];
}

function spawnSparkles(container){

  for(let i = 0; i < count; i++){
    const s = document.createElement('span');
    s.className = 'sparkle';
    const angle = Math.random() * Math.PI * 2;
    const dist = 46 + Math.random() * 70;
    s.style.setProperty('--dx', `${(Math.cos(angle) * dist).toFixed(1)}px`);
    s.style.setProperty('--dy', `${(Math.sin(angle) * dist).toFixed(1)}px`);
    s.style.animationDelay = `${(Math.random() * 0.18).toFixed(2)}s`;

function getDealOffset(){

function drawOptions(){

function renderSpread(animate){
  spreadEl.innerHTML = '';
  if(!pendingDraw) return;
  const dealOffset = animate ? getDealOffset() : null;
  const deckIndex = pendingDraw.indices[0];
  const card = DECK[deckIndex];
  const isRevealed = pendingDraw.revealed.has(deckIndex);

  const row = document.createElement('div');
  row.className = 'reveal-row';

  const slot = document.createElement('div');
  slot.className = 'slot';
  slot.style.animationDelay = `${(Math.random() * 6.8).toFixed(2)}s`;
  if(animate){
    slot.style.animationPlayState = 'paused';
  }
  const animClass = animate ? ' card-deal' : '';
  const animStyle = animate ? ` style="animation-delay:0s;--deal-offset:${dealOffset}px"` : '';
  slot.innerHTML = `
    <div class="card${isRevealed ? ' flipped' : ''}${animClass}"${animStyle} role="button" tabindex="0" aria-label="ไพ่ใบนี้ แตะเพื่อเปิด">
      <div class="face back">
        ${backSvg()}
      </div>
      <div class="face front${card.img ? ' has-art' : ''}">
        ${card.img
          ? `<img class="card-art" src="${card.img}" alt="${card.name}" loading="lazy">`
          : `<div class="card-symbol">${card.symbol}</div><div class="card-name">${card.name}</div>`}
      </div>
    </div>`;
  row.appendChild(slot);

  const meaningPanel = document.createElement('div');
  meaningPanel.className = 'meaning-panel';
  row.appendChild(meaningPanel);

  spreadEl.appendChild(row);

  if(isRevealed){
    renderMeaningPanel(card);
  }

  const cardEl = slot.querySelector('.card');
  const reveal = () => {
    if(!pendingDraw || pendingDraw.revealed.has(deckIndex)) return;
    cardEl.classList.add('flipped');
    slot.classList.add('burst');
    spawnSparkles(slot);
    triggerLightningFlash();
    openCard(card, deckIndex);
  };
  cardEl.addEventListener('click', reveal);
  cardEl.addEventListener('keydown', e => {
    if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); reveal(); }
  });
  const glowDelay = `${(Math.random() * 10).toFixed(2)}s`;
  if(!animate){
    cardEl.style.animationDelay = glowDelay;
  }

      cardEl.classList.remove('card-deal');
      cardEl.style.animationDelay = glowDelay;
      slot.style.animationPlayState = 'running';
    }, { once: true });

// initial state on load — restore any in-progress/completed reading (survives back-navigation / reload)
const STORAGE_KEY = 'tewarattikan_reading_v3';

function encodeState(){
  if(!currentAspect || !pendingDraw) return null;
  return encodeURIComponent(JSON.stringify({
    a: currentAspect,
    i: pendingDraw.indices,
    r: [...pendingDraw.revealed]
  }));
}

function saveState(){
  const encoded = encodeState();
  if(!encoded) return;
  try{ localStorage.setItem(STORAGE_KEY, encoded); }catch(e){}
  try{ sessionStorage.setItem(STORAGE_KEY, encoded); }catch(e){}
  try{ location.hash = 's=' + encoded; }catch(e){}
}

function clearSavedState(){
  try{ localStorage.removeItem(STORAGE_KEY); }catch(e){}
  try{ sessionStorage.removeItem(STORAGE_KEY); }catch(e){}
  try{ location.hash = ''; }catch(e){}
}

function loadState(){
  let raw = null;
  if(location.hash && location.hash.indexOf('#s=') === 0){
    raw = location.hash.slice(3);
  }
  if(!raw){
    try{ raw = sessionStorage.getItem(STORAGE_KEY); }catch(e){}
  }
  if(!raw){
    try{ raw = localStorage.getItem(STORAGE_KEY); }catch(e){}
  }
  if(!raw) return false;

  try{
    const data = JSON.parse(decodeURIComponent(raw));
    if(!data || !data.a || !Array.isArray(data.i)) return false;

    currentAspect = data.a;
    pendingDraw = { indices: data.i, revealed: new Set(data.r || []) };
    usedCardIndices = new Set(pendingDraw.revealed);
    readingLocked = pendingDraw.revealed.size > 0;

    renderSpread(false);
    if(pendingDraw.revealed.size > 0){
      renderDonateBanner();
      setResetBtnsState(true);
    }
    return true;
  }catch(e){
    return false;
  }
}

function makeNoiseBuffer(ctx, seconds){
  const bufferSize = Math.max(1, Math.floor(ctx.sampleRate * seconds));
  const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
  const data = buffer.getChannelData(0);
  for(let i = 0; i < bufferSize; i++){
    data[i] = Math.random() * 2 - 1;
  }
  return buffer;
}

function startWind(ctx, destination){
  const noiseSource = ctx.createBufferSource();
  noiseSource.buffer = makeNoiseBuffer(ctx, 4);
  noiseSource.loop = true;

  const filter = ctx.createBiquadFilter();
  filter.type = 'lowpass';
  filter.frequency.value = 480;
  filter.Q.value = 0.6;

  const gain = ctx.createGain();
  const baseGain = 0.02; // เพิ่มความดังโดยรวมขึ้น ให้ได้ยินชัดขึ้นทั้งบนคอมและมือถือ
  const startNow = ctx.currentTime;
  gain.gain.setValueAtTime(0.0001, startNow);
  gain.gain.linearRampToValueAtTime(baseGain, startNow + 5); // เริ่มเปิดโปรแกรม: เสียงค่อยๆ ดังขึ้นจากเบาไปหาระดับปกติ (ไล่ระดับ 5 วิ)

  // ปรับความถี่ตัวกรองขึ้นลงช้าๆ ให้เสียงลมมีจังหวะพัดเบาๆ ไม่นิ่งจนน่าเบื่อ
  const lfo = ctx.createOscillator();
  lfo.frequency.value = 0.06;
  const lfoGain = ctx.createGain();
  lfoGain.gain.value = 160;
  lfo.connect(lfoGain);
  lfoGain.connect(filter.frequency);
  lfo.start();

  // ปรับระดับเสียง (volume) ขึ้นลงช้าๆ สลับเบา-ดัง เหมือนลมพัดเป็นระลอก
  const volLfo = ctx.createOscillator();
  volLfo.type = 'sine';
  volLfo.frequency.value = 0.035; // 1 รอบ (เบา→ดัง→เบา) ประมาณ 28 วินาที
  const volLfoGain = ctx.createGain();
  volLfoGain.gain.value = 0.016; // เพิ่มขึ้นตามสัดส่วนกับ baseGain
  volLfo.connect(volLfoGain);
  volLfoGain.connect(gain.gain);
  volLfo.start();

  noiseSource.connect(filter);
  filter.connect(gain);
  gain.connect(destination);
  noiseSource.start();

  return { noiseSource, lfo, volLfo, gain };
}

// ทิศทางที่แสงฟ้าแลบจะสุ่มโผล่มา: จาก 4 ขอบ (บน/ล่าง/ซ้าย/ขวา) และ 4 มุม (บนซ้าย/บนขวา/ล่างซ้าย/ล่างขวา)
// ระยะพุ่ง (แกนยาว) ตั้งค่าให้แสงสว่างเกือบถึงขอบ/มุมฝั่งตรงข้าม ส่วนแกนกว้างแคบกว่าให้ดูเหมือนลำแสงจริง
const FLASH_ORIGINS = [
  { pos:'50% 0%',   size:'35% 108%' }, // บน        → พุ่งลงเกือบถึงขอบล่าง
  { pos:'50% 100%', size:'35% 108%' }, // ล่าง       → พุ่งขึ้นเกือบถึงขอบบน
  { pos:'0% 50%',   size:'108% 35%' }, // ซ้าย       → พุ่งไปเกือบถึงขอบขวา
  { pos:'100% 50%', size:'108% 35%' }, // ขวา        → พุ่งไปเกือบถึงขอบซ้าย
  { pos:'0% 0%',     size:'115% 115%' }, // มุมบนซ้าย  → พุ่งทแยงเกือบถึงมุมล่างขวา
  { pos:'100% 0%',   size:'115% 115%' }, // มุมบนขวา   → พุ่งทแยงเกือบถึงมุมล่างซ้าย
  { pos:'0% 100%',   size:'115% 115%' }, // มุมล่างซ้าย → พุ่งทแยงเกือบถึงมุมบนขวา
  { pos:'100% 100%', size:'115% 115%' }  // มุมล่างขวา  → พุ่งทแยงเกือบถึงมุมบนซ้าย
];

function triggerLightningFlash(){
  if(!flashEl) return;
  const origin = FLASH_ORIGINS[Math.floor(Math.random() * FLASH_ORIGINS.length)];
  flashEl.style.background =
    `radial-gradient(ellipse ${origin.size} at ${origin.pos}, rgba(255,255,255,.95) 0%, rgba(220,232,255,.65) 30%, rgba(210,225,255,0) 85%)`;

  const strength = 0.5 + Math.random() * 0.42; // แสงจริงจะสว่างจ้ากว่าเดิม
  flashEl.classList.add('flash');
  flashEl.style.opacity = strength;
  setTimeout(() => { flashEl.style.opacity = 0; }, 70 + Math.random() * 90);
  if(Math.random() < 0.45){
    setTimeout(() => {
      flashEl.style.opacity = strength * 0.6;
      setTimeout(() => { flashEl.style.opacity = 0; }, 60);
    }, 140 + Math.random() * 120);
  }
}

/* ===== เสียงคนเดินบนพื้นไม้: ดังจากไกลๆ แล้วค่อยๆ เดินใกล้เข้ามา สุ่มจากด้านซ้ายหรือขวา ===== */
function makeFootstepBuffer(ctx){
  const dur = 0.12;
  const bufferSize = Math.max(1, Math.floor(ctx.sampleRate * dur));
  const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
  const data = buffer.getChannelData(0);
  for(let i = 0; i < bufferSize; i++){
    const decay = Math.pow(1 - i / bufferSize, 2.2); // เสียงเอี๊ยด/ลั่นของไม้ ดังแล้วหายเร็ว
    data[i] = (Math.random() * 2 - 1) * decay;
  }
  return buffer;
}

function playFootstep(ctx, destination, opts){
  const now = ctx.currentTime;
  const hasPanner = typeof ctx.createStereoPanner === 'function';
  const panner = hasPanner ? ctx.createStereoPanner() : null;
  if(panner) panner.pan.value = Math.max(-1, Math.min(1, opts.pan));
  const outNode = panner || destination;
  if(panner) panner.connect(destination);

  // เสียงไม้เอี๊ยด/สัมผัสพื้น (บริเวณความถี่กลาง)
  const noiseSource = ctx.createBufferSource();
  noiseSource.buffer = makeFootstepBuffer(ctx);

  const bandpass = ctx.createBiquadFilter();
  bandpass.type = 'bandpass';
  bandpass.frequency.value = 320 + opts.brightness * 480 + Math.random() * 120; // ใกล้ = เสียงคมชัดขึ้น
  bandpass.Q.value = 1.1;

  const noiseGain = ctx.createGain();
  noiseGain.gain.setValueAtTime(0.0001, now);
  noiseGain.gain.linearRampToValueAtTime(opts.gain, now + 0.008);
  noiseGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.15);

  noiseSource.connect(bandpass);
  bandpass.connect(noiseGain);
  noiseGain.connect(outNode);
  noiseSource.start(now);
  noiseSource.stop(now + 0.16);

  // เสียงน้ำหนักเท้ากระแทกพื้นโทนต่ำ เสริมความหนักแน่นสมจริง
  const thump = ctx.createOscillator();
  thump.type = 'sine';
  thump.frequency.value = 85 + Math.random() * 20;
  const thumpGain = ctx.createGain();
  thumpGain.gain.setValueAtTime(0.0001, now);
  thumpGain.gain.linearRampToValueAtTime(opts.gain * 0.55, now + 0.005);
  thumpGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.09);
  thump.connect(thumpGain);
  thumpGain.connect(outNode);
  thump.start(now);
  thump.stop(now + 0.1);
}

function playFootstepSequence(ctx, destination){
  const side = Math.random() < 0.5 ? -1 : 1; // สุ่มว่าเสียงเดินมาจากด้านซ้ายหรือขวา
  const farSteps = 3 + Math.floor(Math.random() * 2);  // เดินตอนไกล 3-4 ก้าว
  const nearSteps = 1 + Math.floor(Math.random() * 2); // เดินตอนใกล้ 1-2 ก้าว
  const steps = farSteps + nearSteps;
  const baseGapMs = (540 + Math.random() * 90) * 4; // ช้าลงอีก 50% จากรอบก่อน (รวมช้าลง 4 เท่าจากจังหวะเดินปกติ)

  footstepStepTimers.forEach(t => clearTimeout(t));
  footstepStepTimers = [];

  let elapsed = 0;
  for(let i = 0; i < steps; i++){
    // ระยะห่างแต่ละก้าวไม่เท่ากัน ให้ฟังดูเป็นการเดินจริงๆ ไม่ใช่จังหวะกลไกเป๊ะๆ
    if(i > 0) elapsed += baseGapMs * (0.6 + Math.random() * 0.8);

    // ก้าวช่วงไกล (3-4 ก้าวแรก) = เบา/มัว, ก้าวช่วงใกล้ (1-2 ก้าวสุดท้าย) = ดัง/ชัด
    let progress;
    if(i < farSteps){
      progress = (i / farSteps) * 0.45; // 0 - 0.45
    } else {
      const nearIndex = i - farSteps;
      progress = 0.7 + (nearIndex / Math.max(nearSteps - 1, 1)) * 0.3; // 0.7 - 1.0
    }

    const pan = side * (0.85 - progress * 0.35); // เริ่มชัดจากด้านข้าง แล้วขยับเข้าใกล้กึ่งกลางเล็กน้อยตอนใกล้
    const gain = 0.025 + progress * 0.07; // เพิ่มความดังโดยรวมขึ้น ให้ได้ยินชัดขึ้นทั้งบนคอมและมือถือ
    const stepTimer = setTimeout(() => {
      if(!ambientRunning) return;
      playFootstep(ctx, destination, { pan, gain, brightness: progress });
    }, elapsed);
    footstepStepTimers.push(stepTimer);
  }
}

function scheduleFootsteps(ctx, destination){
  const delay = 22000 + Math.random() * 26000; // ห่างๆ ไม่ให้ถี่จนน่ารำคาญ
  footstepTimer = setTimeout(() => {
    if(!ambientRunning) return;
    playFootstepSequence(ctx, destination);
    scheduleFootsteps(ctx, destination);
  }, delay);
}

let soundInitialized = false; // ตัวสร้างเสียงลม (node graph) ถูกสร้างแค่ครั้งเดียว
let userMutedSound = false;   // true เฉพาะตอนผู้ใช้กดปุ่มปิดเสียงเองเท่านั้น

function startAmbientSound(){
  if(!audioCtx){
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if(!soundInitialized){
    startWind(audioCtx, audioCtx.destination);
    soundInitialized = true;
  }
  if(audioCtx.state === 'suspended'){
    audioCtx.resume();
  }
  if(!ambientRunning){
    ambientRunning = true;
    scheduleFootsteps(audioCtx, audioCtx.destination);
  }

  soundToggleBtn.innerHTML = '<svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h3l5 -5v16l-5 -5h-3a1 1 0 0 1 -1 -1v-4a1 1 0 0 1 1 -1z"/><path d="M16 9a5 5 0 0 1 0 6"/><path d="M18.5 6.5a9 9 0 0 1 0 11"/></svg>';
  soundToggleBtn.setAttribute('aria-label', 'ปิดเสียงประกอบ');
}

function stopAmbientSound(){
  ambientRunning = false;
  if(footstepTimer) clearTimeout(footstepTimer);
  footstepStepTimers.forEach(t => clearTimeout(t));
  footstepStepTimers = [];
  if(audioCtx) audioCtx.suspend();

  soundToggleBtn.innerHTML = '<svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h3l5 -5v16l-5 -5h-3a1 1 0 0 1 -1 -1v-4a1 1 0 0 1 1 -1z"/><line x1="15" y1="8" x2="22" y2="16"/><line x1="22" y1="8" x2="15" y2="16"/></svg>';
  soundToggleBtn.setAttribute('aria-label', 'เปิดเสียงประกอบ');
}

soundToggleBtn.addEventListener('click', () => {
  if(ambientRunning){
    userMutedSound = true;
    stopAmbientSound();
  } else {
    userMutedSound = false;
    startAmbientSound();
  }
});

/* เบราว์เซอร์ (Chrome / Safari / Firefox) จะไม่ยอมเล่นเสียงอัตโนมัติ
   จนกว่าผู้ใช้จะโต้ตอบกับหน้าเว็บอย่างน้อย 1 ครั้ง (นโยบาย autoplay ของเบราว์เซอร์เอง แก้ที่โค้ดไม่ได้ทั้งหมด)
   โค้ดนี้จึงลองเริ่มเสียงทันทีที่โหลดหน้า และถ้าเบราว์เซอร์ยังบล็อกอยู่
   จะเริ่มเสียงทันทีที่ผู้ใช้แตะจอ/คลิก/กดปุ่มใดๆ เป็นครั้งแรก
   ทำให้รู้สึกเหมือนเสียงลมดังขึ้นเองตั้งแต่เข้ามาในหน้า */
function tryAutoStartOnLoad(){
  if(userMutedSound) return;
  startAmbientSound();
  if(audioCtx.state !== 'running'){
    const resumeOnFirstInteraction = () => {
      if(!userMutedSound && audioCtx.state !== 'running'){
        audioCtx.resume();
      }
      ['pointerdown','keydown','touchstart'].forEach(evt =>
        window.removeEventListener(evt, resumeOnFirstInteraction)
      );
    };
    ['pointerdown','keydown','touchstart'].forEach(evt =>
      window.addEventListener(evt, resumeOnFirstInteraction, { once:true })
    );
  }
}
tryAutoStartOnLoad();
</script>
